# N4MI Calendar Display -- household calendar server (n4misrv, port 8087)
#
# Deployed with Portainer: Stacks -> Add stack (n4misrv environment) -> Repository
#   Name:            n4mi-calendar-display
#   Repository URL:  https://github.com/N4MI73/n4mi-calendar-display
#   Reference:       refs/heads/main
#   Compose path:    server/docker-compose.yml
#
# The image is built by GitHub Actions (.github/workflows/build-image.yml) and
# published to ghcr.io; Portainer only pulls it. pull_policy: always makes
# "Pull and redeploy" fetch the newest image.
#
# Before the first deploy, on n4misrv:
#   sudo mkdir -p /srv/docker/n4mi-calendar-display/data
#   sudo chown 1000:1000 /srv/docker/n4mi-calendar-display/data
# The SQLite database lives there, where the nightly host backup picks it up.
#
# No secrets in this file. (Google import URLs arrive in a later phase and will
# be Portainer environment variables only.)

services:
  calendar:
    image: ghcr.io/n4mi73/n4mi-calendar-display:latest
    pull_policy: always
    container_name: n4mi-calendar-display
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - TZ=America/New_York
    volumes:
      - /srv/docker/n4mi-calendar-display/data:/data
