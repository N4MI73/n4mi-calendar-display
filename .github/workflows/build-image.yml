# Test the server, then build its Docker image and publish it to GitHub
# Container Registry (ghcr.io). Portainer on n4misrv then only PULLS the image.
#
# Why: Portainer cannot build images on an Agent-connected environment (n4misrv)
# (portainer/portainer issue #13255). Building here avoids that.
#
# Runs on every push to main that touches server/, or by hand from the
# Actions tab ("Run workflow"). If the tests fail, no image is published.
#
# Image (tags: latest + the short commit SHA, for rollback):
#   ghcr.io/n4mi73/n4mi-calendar-display

name: Build image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r server/requirements-dev.txt
      - name: Run tests
        working-directory: server
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/n4mi73/n4mi-calendar-display:latest
            ghcr.io/n4mi73/n4mi-calendar-display:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/N4MI73/n4mi-calendar-display
